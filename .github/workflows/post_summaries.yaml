name: Comment on the pull request

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - Health
    types:
      - completed

jobs:
  upload:
    if: ${{ github.repository_owner == 'PDFtoMark' }}
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@f8faabf263f94a7a8508c5e57f1ff3752fa23915
    permissions:
      pull-requests: write
